services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    pull_policy: daily
    environment:
      EULA: "true"
      TYPE: "FABRIC"
      VERSION: "26.2"
      MEMORY: "2G"
      USE_AIKAR_FLAGS: "true"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # Automatically download essential performance mods from Modrinth
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        krypton
    volumes:
      - ${MEDIA}/Minecraft:/data
    networks:
      - mc-net
    labels:
      glance.id: mc
      glance.name: Minecraft
      glance.icon: auto-invert sh:minecraft-dark
      glance.url: ${PLAYIT_TUNNEL}
      glance.category: Media
      glance.description: Multiplayer Server

      docker-volume-backup.stop-during-backup: "true"

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-agent
    restart: unless-stopped
    environment:
      - SECRET_KEY=${PLAYIT_SECRET}
    volumes:
      - ${DATA}/playit:/data
    networks:
      - mc-net
    labels:
      glance.parent: mc
      glance.name: PlayIt Agent

networks:
  mc-net:
    driver: bridge