networks:
  proxy-public:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    labels:
      glance.name: Jellyfin
      glance.icon: si:jellyfin
      glance.description: Films & Shows
      glance.category: Media
      glance.url: http://${URL}:8096

      traefik.enable: "true"
      traefik.docker.network: "proxy-public"
      ## HTTP Router
      #### Entry point where Jellyfin is accessible via
      #### Change secure to https in the line below to have accessible without needing to specify a port and change the SSLHost option below
      traefik.http.routers.jellyfin.entryPoints: secure
      #### Host or Path where Jellyfin is accessible
      #### Remove (or change) this rule if you'd rather have Jellyfin accessible at a PathPrefix URI
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.richard-hughes.dev`) # OPTIONAL: && PathPrefix(`/jellyfin`)
      #### Enable TLS with the ACME/LetsEncrypt resolver for HOSTNAME.DOMAIN_NAME
      traefik.http.routers.jellyfin.tls: "true"
      # traefik.http.routers.jellyfin.tls.certResolver: leresolver
      traefik.http.routers.jellyfin.tls.domains: jellyfin.richard-hughes.dev
      ## Middleware
      traefik.http.routers.jellyfin.middlewares: jellyfin-mw
      #### The customResponseHeaders option lists the Header names and values to apply to the response.
      traefik.http.middlewares.jellyfin-mw.headers.customResponseHeaders.X-Robots-Tag: noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex
      #### The sslRedirect is set to true, then only allow https requests.
      traefik.http.middlewares.jellyfin-mw.headers.SSLRedirect: true
      
      traefik.http.routers.jellyfin.service: jellyfin
      traefik.http.services.jellyfin-svc.loadBalancer.server.port: "8096"
      traefik.http.services.jellyfin-svc.loadBalancer.passHostHeader: "true"
      ## Redirection of HTTP on port 9999 to HTTPS on port 9999 (consistent protocol)
      traefik.http.routers.jellyfin-insecure.entryPoints: secure
      traefik.http.routers.jellyfin-insecure.rule: Host(`jellyfin.richard-hughes.dev`)' # OPTIONAL: && PathPrefix(`/jellyfin`)
      traefik.http.routers.jellyfin-insecure.middlewares: jellyfin-insecure-mw
      traefik.http.middlewares.jellyfin-insecure-mw.redirectscheme.scheme: https
      traefik.http.middlewares.jellyfin-insecure-mw.redirectscheme.port: 9999 # remove if you are using a default port
      traefik.http.middlewares.jellyfin-insecure-mw.redirectscheme.permanent: false
      traefik.http.routers.jellyfin-insecure.service: noop@internal

    user: "1000:1000"
    volumes:
      - ${DATA}/jellyfin/config:/config
      - ${DATA}/jellyfin/cache:/cache
      - ${FILMS}:/films
      - ${MUSIC}:/music
      - ${SHOWS}:/shows
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - ${RENDER_GID}
    

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    labels:
      glance.name: Audiobookshelf
      glance.icon: si:audiobookshelf
      glance.description: Audiobooks & eBooks
      glance.category: Media
      glance.url: http://${URL}:13378
    ports:
      - 13378:80
    volumes:
      - ${AUDIOBOOKS}:/audiobooks
      - ${DATA}/audiobookshelf/config:/config
      - ${DATA}/audiobookshelf/metadata:/metadata
    restart: unless-stopped

  miniflux:
    image: miniflux/miniflux:latest
    labels:
      glance.name: Miniflux
      glance.icon: si:rss
      glance.description: Articles
      glance.category: Media
      glance.url: http://${URL}:8060
    ports:
      - "8060:8080"
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      # - DATABASE_URL=postgres://miniflux:secret@db/miniflux?sslmode=disable
      - DATABASE_URL=postgres://miniflux:secret@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=test123
  miniflux-db:
    image: postgres:18
    labels:
      glance.parent: Miniflux
      glance.name: Database
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=miniflux
      - PGDATA=/var/lib/postgresql/data
    volumes:
      # You may have to adjust the volume path depending on the version of Postgres
      # Postgres 18 uses /var/lib/postgresql
      # Postgres 17 and below uses /var/lib/postgresql/data
      # See https://hub.docker.com/_/postgres#pgdata
      - ${DATA}/miniflux:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s